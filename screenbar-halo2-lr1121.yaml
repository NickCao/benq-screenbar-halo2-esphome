# Waveshare ESP32-S3-LR1121-HF, using its onboard 2.4 GHz radio.
halo2:
  radio: LR1121
  auto_discover: true
  radio_address_sensor:
    name: "Radio address"
  discover_button:
    name: "Discover lamp address"
  # RF defaults for the BM5602's 125 kbps mode. Confirm on real hardware.
  frequency_deviation_hz: 160000
  # LR1121 Gaussian BT=0.5 (0x00 disables pulse shaping).
  pulse_shape: 0x09

packages:
  halo2: !include packages/halo2-common.yaml

esphome:
  build_path: build/screenbar-halo2-lr1121
  includes:
    - halo2_protocol.h
    - lr1121_radio.h
    - lr1121_halo2.h

esp32:
  variant: esp32s3
  flash_size: 4MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG
