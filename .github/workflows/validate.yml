name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Test lamp state model
        run: ./scripts/test
      - uses: actions/cache@v4
        with:
          path: .esphome/cache
          key: esphome-${{ runner.os }}-${{ hashFiles('scripts/esphome') }}
      - name: Create compile-only secrets
        run: |
          build_api_key="$(openssl rand -base64 32)"
          sed "s|REPLACE_WITH_A_32_BYTE_BASE64_KEY|${build_api_key}|" \
            secrets.example.yaml > secrets.yaml
      - name: Compile firmware with Podman
        run: ./scripts/esphome compile screenbar-halo2-lr1121.yaml
