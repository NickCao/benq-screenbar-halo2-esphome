name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hardware-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/hardware/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r tests/hardware/requirements.txt
      - name: Validate hardware tests without a device
        run: python -m pytest tests/hardware -v
  firmware:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Test bridge models and coordinator
        run: ./scripts/test
      - name: Test experimental SDR demodulation
        run: ./experiments/esp32-sdr/test
      - uses: actions/cache@v4
        with:
          path: .esphome/cache
          key: esphome-${{ runner.os }}-${{ hashFiles('scripts/esphome') }}
      - name: Create compile-only secrets
        run: |
          build_api_key="$(openssl rand -base64 32)"
          sed "s|REPLACE_WITH_A_32_BYTE_BASE64_KEY|${build_api_key}|" \
            secrets.example.yaml > secrets.yaml
      - name: Compile firmware with Podman
        run: ./scripts/esphome compile screenbar-halo2-lr1121.yaml
