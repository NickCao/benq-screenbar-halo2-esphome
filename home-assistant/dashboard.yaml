title: Office
icon: mdi:desk
views:
  - title: ScreenBar
    path: screenbar
    icon: mdi:monitor-shimmer
    cards:
      - type: tile
        entity: light.screenbar
        name: ScreenBar
        icon: mdi:wall-sconce-flat
        features:
          - type: light-brightness
          - type: light-color-temp

      - type: tile
        entity: select.screenbar_lighting_mode
        name: Lighting mode
        tap_action:
          action: more-info

      - type: tile
        entity: number.screenbar_front_brightness
        name: Front brightness
        features:
          - type: numeric-input
            style: slider

      - type: tile
        entity: number.screenbar_back_brightness
        name: Back brightness
        features:
          - type: numeric-input
            style: slider

      - type: tile
        entity: select.screenbar_ultrasonic_sensor
        name: Automatic presence mode
        icon: mdi:motion-sensor
        tap_action:
          action: more-info
