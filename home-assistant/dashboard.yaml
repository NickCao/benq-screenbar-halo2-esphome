title: Office
icon: mdi:desk
views:
  - title: ScreenBar
    path: screenbar
    icon: mdi:monitor-shimmer
    cards:
      - type: tile
        entity: light.benq_screenbar_halo_2_front_lamp
        name: Front
        icon: mdi:desk-lamp
        features:
          - type: light-brightness
          - type: light-color-temp

      - type: tile
        entity: light.benq_screenbar_halo_2_back_lamp
        name: Back
        icon: mdi:wall-sconce-flat-outline
        features:
          - type: light-brightness
          - type: light-color-temp

      - type: tile
        entity: select.benq_screenbar_halo_2_ultrasonic_sensor
        name: Automatic presence mode
        icon: mdi:motion-sensor
        tap_action:
          action: more-info
